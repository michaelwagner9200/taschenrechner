<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zucker im Körper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Layout: Körperschema mit wandernden Teilchen links, Schritt-Erklärung, Blutzuckerkurve und Ablauf rechts (mobil gestapelt) */
  :root {
    --paper: #edf0f2; --surface: #f8f9fa; --ink: #1b2228; --muted: #56616b; --line: #c5ccd2; --grid: #dde2e6;
    --accent: #d9580a; --accent-ink: #ffffff;
    --body: #e2e6e9; --body-line: #b9c1c8;
    --brain: #e3a3b3; --tube: #dba38a; --stomach: #e6ad8e; --liver: #9a4a3d; --pancreas: #dcbb5c;
    --blood: #c8423f; --muscle: #d6756b; --fat: #efd98f; --fat-hi: #f8ebbb; --on-dark: #ffffff;
    --glucose: #e89a0c; --fructose: #7c4fd6; --insulin: #0c8f85;
    --font-display: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #11161a; --surface: #192025; --ink: #e5e9ec; --muted: #9aa5ae; --line: #2d363d; --grid: #222a30;
      --accent: #ff8a3d; --accent-ink: #1b1006;
      --body: #222a30; --body-line: #3a454d;
      --brain: #c98a9a; --tube: #b98570; --stomach: #c28d72; --liver: #a35447; --pancreas: #c4a650;
      --blood: #e0605c; --muscle: #c0665d; --fat: #cdb86f; --fat-hi: #e2d19a; --on-dark: #ffffff;
      --glucose: #ffb938; --fructose: #a887f5; --insulin: #2cc4b7;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #11161a; --surface: #192025; --ink: #e5e9ec; --muted: #9aa5ae; --line: #2d363d; --grid: #222a30;
    --accent: #ff8a3d; --accent-ink: #1b1006;
    --body: #222a30; --body-line: #3a454d;
    --brain: #c98a9a; --tube: #b98570; --stomach: #c28d72; --liver: #a35447; --pancreas: #c4a650;
    --blood: #e0605c; --muscle: #c0665d; --fat: #cdb86f; --fat-hi: #e2d19a; --on-dark: #ffffff;
    --glucose: #ffb938; --fructose: #a887f5; --insulin: #2cc4b7;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.55 var(--font-body);
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  h1 { font: 700 clamp(1.8rem, 4vw, 2.6rem)/1.05 var(--font-display); margin: 0; letter-spacing: -0.01em; }
  .lede { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    font: 600 1rem var(--font-display); letter-spacing: 0.02em; cursor: pointer;
    border-radius: 6px; padding: 9px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 120px; }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .steps button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }

  figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #body { display: block; width: 100%; height: auto; max-height: 82vh; margin: 0 auto; }
  figcaption { border-top: 1px solid var(--line); padding: 10px 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 0.86rem; color: var(--muted); }
  .legend li { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 22px; height: 14px; flex: none; }

  /* Körperschema */
  .f-body { fill: var(--body); stroke: var(--body-line); stroke-width: 2; }
  .organ { opacity: .42; transition: opacity .4s; }
  .organ.on { opacity: 1; }
  .organ.on .shape { stroke: var(--ink); stroke-width: 2; }
  .f-brain { fill: var(--brain); } .f-stomach { fill: var(--stomach); } .f-liver { fill: var(--liver); }
  .f-pancreas { fill: var(--pancreas); } .f-heart { fill: var(--blood); } .f-muscle { fill: var(--muscle); }
  .f-fat { fill: var(--fat); } .f-fat-hi { fill: var(--fat-hi); } .f-mouth { fill: var(--ink); }
  .tube { fill: none; stroke: var(--tube); stroke-linecap: round; stroke-linejoin: round; }
  .tube-in { fill: none; stroke: var(--surface); stroke-opacity: .45; stroke-linecap: round; stroke-linejoin: round; }
  .vessel { fill: none; stroke: var(--blood); stroke-width: 7; stroke-linecap: round; opacity: .28; transition: opacity .4s; }
  .vessel.on { opacity: .6; }
  .hint { fill: none; stroke-width: 1.5; stroke-dasharray: 3 5; opacity: 0; transition: opacity .4s; }
  .hint.on { opacity: .8; }
  .route { fill: none; stroke: none; }
  .lbl { font: 600 17px var(--font-display); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .lbl.in { fill: var(--on-dark); stroke: none; }
  .lbl.dim { fill: var(--muted); }
  @media (max-width: 560px) { .lbl { font-size: 23px; } }
  .gate { fill: var(--accent); transition: transform .6s; }
  #body[data-stage="6"] .gate, #body[data-stage="7"] .gate { transform: translateY(-28px); }
  .glyco { fill: var(--glucose); stroke: var(--surface); stroke-width: 1; opacity: 0; transition: opacity .8s; }
  #body[data-stage="7"] .glyco, #body[data-stage="8"] .glyco { opacity: 1; }
  .drop { transform-box: fill-box; transform-origin: center; transition: transform 1.2s; }
  #body[data-stage="7"] .drop, #body[data-stage="8"] .drop { transform: scale(1.18); }
  .pulse { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; }
  #body[data-stage="0"] .pulse { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.35); } }

  /* Teilchen */
  .p-glu { fill: var(--glucose); } .p-fru { fill: var(--fructose); } .p-ins { fill: var(--insulin); } .p-sig { fill: var(--accent); }
  .particle > * { stroke: var(--surface); stroke-width: 1.5; }

  /* Seitenleiste */
  aside { display: grid; gap: 16px; min-width: 0; }
  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-height: 190px; }
  .eyebrow { font: 500 0.72rem var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
  .detail h2 { font: 700 1.4rem/1.15 var(--font-display); margin: 4px 0 8px; text-wrap: balance; }
  .detail p { margin: 0; max-width: 62ch; }

  .chart h3, .steps-head { font: 500 0.72rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
  #chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
  #chart text { font: 500 11px var(--font-mono); fill: var(--muted); }
  #chart .gridline { stroke: var(--grid); stroke-width: 1; }
  #chart .axis { stroke: var(--line); stroke-width: 1; }
  #chart .ghost { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
  #chart .curve { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  #chart .area { fill: var(--accent); opacity: .12; }
  #chart .marker { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  #chart .cross { stroke: var(--muted); stroke-width: 1; }
  #chart .tip { fill: var(--ink); font-size: 12px; }
  .note { font-size: 0.82rem; color: var(--muted); margin: 4px 0 0; }
  details { font-size: 0.86rem; color: var(--muted); margin-top: 6px; }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 2px 12px 2px 0; font-weight: 400; }
  th { font-weight: 500; color: var(--ink); }

  .steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .steps li { border-bottom: 1px solid var(--line); }
  .steps button {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 5.6em minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 6px;
  }
  .steps .when { font: 500 0.78rem var(--font-mono); color: var(--muted); }
  .steps .what { font: 600 1rem var(--font-display); }
  .steps button:hover, .steps button.on { background: var(--surface); }
  .steps button.on .when { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .organ, .vessel, .gate, .glyco, .drop { transition: none; }
    #body[data-stage="0"] .pulse { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Zucker im Körper</h1>
      <p class="lede">Was in den ersten drei Stunden passiert, nachdem du etwas Süßes gegessen oder getrunken hast.</p>
    </div>
    <div class="controls">
      <button class="btn" id="prev" type="button">Zurück</button>
      <button class="btn primary" id="play" type="button">Pause</button>
      <button class="btn" id="next" type="button">Weiter</button>
    </div>
  </header>

  <main>
    <figure>
      <svg id="body" viewBox="0 0 680 730" role="img" aria-labelledby="bodyTitle" data-stage="0">
        <title id="bodyTitle">Schema des Körpers mit dem Weg des Zuckers durch Mund, Magen, Darm, Leber, Blut und Zellen</title>

        <!-- Silhouette -->
        <rect class="f-body" x="314" y="150" width="52" height="60"/>
        <rect class="f-body" x="212" y="188" width="256" height="520" rx="84"/>
        <circle class="f-body" cx="340" cy="100" r="70"/>

        <!-- Blutgefäße -->
        <path id="p-portal" class="vessel" data-v="portal" d="M272,524 C236,520 228,480 232,440 C236,400 246,376 262,352"/>
        <path id="p-lh" class="vessel" data-v="lh" d="M296,286 C302,262 318,246 334,240"/>
        <path id="p-brain" class="vessel" data-v="brain" d="M338,228 C318,205 314,150 318,100"/>
        <path id="p-muscle" class="vessel" data-v="muscle" d="M352,236 C430,228 470,330 512,392 L562,395"/>
        <path id="p-fat" class="vessel" data-v="fat" d="M350,242 C440,262 480,500 536,596 L582,612"/>
        <path id="p-ins" class="hint" data-v="ins" style="stroke: var(--insulin)" d="M410,424 C446,396 440,296 356,244"/>
        <path id="p-nerve" class="hint" data-v="nerve" style="stroke: var(--accent)" d="M340,148 C380,146 384,108 366,92"/>
        <path id="p-stomach" class="route" d="M350,314 C394,322 404,372 372,392 C356,402 342,400 332,394"/>

        <!-- Organe -->
        <g class="organ" data-o="brain">
          <ellipse class="pulse" cx="340" cy="72" rx="46" ry="28"/>
          <ellipse class="shape f-brain" cx="340" cy="72" rx="46" ry="28"/>
          <path d="M306,70 C316,58 326,80 338,66 C348,56 358,80 372,68" fill="none" stroke="var(--surface)" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <g class="organ" data-o="mouth">
          <ellipse class="shape f-mouth" cx="340" cy="150" rx="17" ry="6"/>
        </g>
        <g class="organ" data-o="eso">
          <path id="p-eso" class="tube" stroke-width="13" d="M340,156 L340,280 Q340,300 352,312"/>
        </g>
        <g class="organ" data-o="stomach">
          <path class="shape f-stomach" d="M345,298 C398,288 428,330 412,376 C400,412 350,416 330,396 C318,382 330,350 335,330 C337,318 338,306 345,298Z"/>
        </g>
        <g class="organ" data-o="gut">
          <path id="p-gut" class="tube" stroke-width="20" d="M332,394 C300,404 286,436 300,470 H400 a18,18 0 0 1 0,36 H290 a18,18 0 0 0 0,36 H400 a18,18 0 0 1 0,36 H290 a18,18 0 0 0 0,36 H385"/>
          <path class="tube-in" stroke-width="6" d="M332,394 C300,404 286,436 300,470 H400 a18,18 0 0 1 0,36 H290 a18,18 0 0 0 0,36 H400 a18,18 0 0 1 0,36 H290 a18,18 0 0 0 0,36 H385"/>
        </g>
        <g class="organ" data-o="pancreas">
          <path class="shape f-pancreas" d="M344,434 C350,420 380,420 410,424 C430,426 442,430 440,436 C438,444 410,446 380,446 C356,446 342,444 344,434Z"/>
        </g>
        <g class="organ" data-o="liver">
          <path class="shape f-liver" d="M222,318 C226,290 262,278 300,284 C324,288 334,300 330,316 C324,340 290,354 262,354 C238,354 220,340 222,318Z"/>
          <circle class="glyco" cx="246" cy="334" r="4.5"/><circle class="glyco" cx="256" cy="339" r="4.5"/><circle class="glyco" cx="266" cy="342" r="4.5"/><circle class="glyco" cx="251" cy="326" r="4.5"/><circle class="glyco" cx="261" cy="331" r="4.5"/>
        </g>
        <g class="organ" data-o="heart">
          <path class="shape f-heart" d="M342,254 C316,236 326,216 342,230 C358,216 368,236 342,254Z"/>
        </g>
        <g class="organ" data-o="muscle">
          <rect class="shape f-muscle" x="520" y="350" width="130" height="90" rx="22"/>
          <path d="M546,372 H630 M546,395 H630 M546,418 H630" fill="none" stroke="var(--surface)" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
          <rect class="gate" x="513" y="380" width="14" height="30" rx="4"/>
          <circle class="glyco" cx="612" cy="384" r="4.5"/><circle class="glyco" cx="622" cy="389" r="4.5"/><circle class="glyco" cx="632" cy="384" r="4.5"/><circle class="glyco" cx="617" cy="406" r="4.5"/><circle class="glyco" cx="627" cy="406" r="4.5"/>
        </g>
        <g class="organ" data-o="fat">
          <circle class="shape f-fat" cx="592" cy="616" r="52"/>
          <circle class="drop f-fat-hi" cx="598" cy="620" r="30"/>
        </g>

        <!-- Beschriftung -->
        <text class="lbl" x="398" y="60">Gehirn</text>
        <text class="lbl" x="314" y="155" text-anchor="end">Mund</text>
        <text class="lbl" x="366" y="216">Herz</text>
        <text class="lbl in" x="282" y="318" text-anchor="middle">Leber</text>
        <text class="lbl" x="376" y="358" text-anchor="middle">Magen</text>
        <text class="lbl" x="448" y="440">Bauchspeicheldrüse</text>
        <text class="lbl dim" x="222" y="462" text-anchor="end">Pfortader</text>
        <text class="lbl" x="340" y="668" text-anchor="middle">Dünndarm</text>
        <text class="lbl" x="585" y="338" text-anchor="middle">Muskelzelle</text>
        <text class="lbl" x="592" y="694" text-anchor="middle">Fettzelle</text>

        <g id="particles"></g>
      </svg>
      <figcaption>
        <ul class="legend">
          <li><svg viewBox="0 0 22 14"><circle class="p-glu" cx="7" cy="7" r="5"/><rect class="p-fru" x="11" y="2.5" width="9" height="9" rx="2"/></svg>Haushaltszucker (Saccharose)</li>
          <li><svg viewBox="0 0 22 14"><circle class="p-glu" cx="11" cy="7" r="5"/></svg>Glukose</li>
          <li><svg viewBox="0 0 22 14"><rect class="p-fru" x="6.5" y="2.5" width="9" height="9" rx="2"/></svg>Fruktose</li>
          <li><svg viewBox="0 0 22 14"><path class="p-ins" d="M11 1 L17 7 L11 13 L5 7Z"/></svg>Insulin</li>
          <li><svg viewBox="0 0 22 14"><circle class="p-sig" cx="11" cy="7" r="3.5"/></svg>Nervensignal</li>
        </ul>
      </figcaption>
    </figure>

    <aside>
      <div class="detail" id="detail" aria-live="polite"></div>

      <div class="chart">
        <h3>Blutzucker in mg/dl</h3>
        <svg id="chart" viewBox="0 0 420 200" role="img" aria-label="Blutzuckerverlauf über drei Stunden nach einer süßen Mahlzeit">
          <g id="cgrid"></g>
          <path class="ghost" id="cghost"/>
          <clipPath id="cclip"><rect id="ccliprect" x="0" y="0" width="0" height="200"/></clipPath>
          <g clip-path="url(#cclip)"><path class="area" id="carea"/><path class="curve" id="ccurve"/></g>
          <line class="cross" id="ccross" y1="14" y2="168" hidden/>
          <circle class="marker" id="cmarker" r="5"/>
          <text class="tip" id="ctip" y="11"></text>
        </svg>
        <p class="note">Schematischer Verlauf bei einem gesunden Erwachsenen. Bei Diabetes steigt der Wert höher und fällt langsamer.</p>
        <details>
          <summary>Werte als Tabelle</summary>
          <table id="ctable"><thead><tr><th>Minute</th><th>mg/dl</th></tr></thead><tbody></tbody></table>
        </details>
      </div>

      <div>
        <p class="steps-head">Ablauf</p>
        <ol class="steps" id="steps"></ol>
      </div>
    </aside>
  </main>
</div>

<script>
  const STAGES = [
    { when: "0 s", min: 0, title: "Im Mund",
      text: "Die Süßrezeptoren auf der Zunge melden den Zucker in Sekundenbruchteilen ans Gehirn. Das Belohnungssystem schüttet Dopamin aus, deshalb fühlt sich Süßes sofort gut an. Zerlegt wird Haushaltszucker (Saccharose) im Mund noch nicht.",
      organs: ["mouth", "brain"], vessels: ["nerve"],
      streams: [{ p: "p-eso", n: 2, type: ["suc"], speed: .3, to: .3 }, { p: "p-nerve", n: 3, type: ["sig"], speed: .7 }] },
    { when: "1–5 min", min: 5, title: "Im Magen",
      text: "Der Zucker rutscht durch die Speiseröhre in den Magen. Dort passiert chemisch wenig mit ihm. Gelöst in Limonade fließt er nach wenigen Minuten weiter. Fett, Eiweiß und Ballaststoffe im Essen bremsen ihn.",
      organs: ["eso", "stomach"], vessels: [],
      streams: [{ p: "p-eso", n: 3, type: ["suc"], speed: .3 }, { p: "p-stomach", n: 4, type: ["suc"], speed: .2 }] },
    { when: "10–20 min", min: 15, title: "Im Dünndarm",
      text: "In der Darmwand sitzt das Enzym Saccharase. Es spaltet jedes Saccharose-Molekül in ein Molekül Glukose (Traubenzucker) und ein Molekül Fruktose (Fruchtzucker). Erst diese Einzelzucker passen durch die Darmwand ins Blut.",
      organs: ["stomach", "gut"], vessels: [],
      streams: [{ p: "p-stomach", n: 2, type: ["suc"], speed: .2 }, { p: "p-gut", n: 10, type: ["split"], speed: .06 }] },
    { when: "15–30 min", min: 25, title: "Über die Pfortader zur Leber",
      text: "Das Blut aus dem Darm fließt über die Pfortader zuerst zur Leber. Sie fängt den größten Teil der Fruktose ab und verarbeitet ihn. Ein Teil der Glukose bleibt ebenfalls hier, der Rest geht weiter in den Kreislauf.",
      organs: ["gut", "liver"], vessels: ["portal"],
      streams: [{ p: "p-gut", n: 6, type: ["split"], speed: .06 }, { p: "p-portal", n: 6, type: ["glu", "fru"], speed: .22 }] },
    { when: "30–45 min", min: 40, title: "Der Blutzucker steigt",
      text: "Das Herz verteilt die Glukose im ganzen Körper. Nüchtern liegt der Blutzucker bei etwa 70 bis 100 mg/dl. Nach einer süßen Mahlzeit steigt er bei Gesunden meist auf höchstens rund 140 mg/dl.",
      organs: ["liver", "heart"], vessels: ["portal", "lh", "brain", "muscle", "fat"],
      streams: [{ p: "p-portal", n: 4, type: ["glu"], speed: .22 }, { p: "p-lh", n: 3, type: ["glu"], speed: .4 },
                { p: "p-muscle", n: 5, type: ["glu"], speed: .2, to: .8 }, { p: "p-fat", n: 5, type: ["glu"], speed: .16, to: .86 },
                { p: "p-brain", n: 3, type: ["glu"], speed: .25 }] },
    { when: "ab 30 min", min: 45, title: "Die Bauchspeicheldrüse reagiert",
      text: "Die Betazellen der Bauchspeicheldrüse messen den Anstieg und schütten Insulin ins Blut aus. Je schneller der Blutzucker steigt, desto mehr Insulin kommt.",
      organs: ["pancreas", "heart"], vessels: ["ins", "lh", "muscle", "fat", "brain"],
      streams: [{ p: "p-ins", n: 6, type: ["ins"], speed: .28 }, { p: "p-lh", n: 2, type: ["glu"], speed: .4 },
                { p: "p-muscle", n: 4, type: ["glu"], speed: .2, to: .8 }, { p: "p-fat", n: 4, type: ["glu"], speed: .16, to: .86 }] },
    { when: "45–90 min", min: 60, title: "Die Zellen öffnen sich",
      text: "Insulin wirkt wie ein Schlüssel. Muskel- und Fettzellen bringen daraufhin Transporter (GLUT4) an ihre Oberfläche, die Glukose strömt hinein und wird zu Energie verbrannt. Das Gehirn nimmt Glukose auch ohne Insulin auf, etwa 120 g am Tag.",
      organs: ["muscle", "fat", "brain", "heart"], vessels: ["muscle", "fat", "brain"],
      streams: [{ p: "p-muscle", n: 6, type: ["glu", "ins"], speed: .22 }, { p: "p-fat", n: 6, type: ["glu", "ins"], speed: .16 },
                { p: "p-brain", n: 3, type: ["glu"], speed: .25 }] },
    { when: "1–2 h", min: 90, title: "Vorräte anlegen",
      text: "Was gerade nicht gebraucht wird, legt der Körper zurück. Leber und Muskeln ketten Glukose zu Glykogen, zusammen rund 400 bis 500 g. Sind diese Speicher voll, baut die Leber den Überschuss zu Fett um, das in den Fettzellen landet.",
      organs: ["liver", "muscle", "fat"], vessels: ["portal", "muscle", "fat"],
      streams: [{ p: "p-portal", n: 3, type: ["glu"], speed: .2 }, { p: "p-muscle", n: 3, type: ["glu"], speed: .2 },
                { p: "p-fat", n: 4, type: ["glu"], speed: .16 }] },
    { when: "2–3 h", min: 150, title: "Danach",
      text: "Der Blutzucker ist zurück im Normalbereich. Nach viel schnellem Zucker kann er kurz etwas unter den Ausgangswert rutschen. Das macht manche müde und wieder hungrig. Sinkt er weiter, setzt die Leber mithilfe des Hormons Glukagon Glukose aus ihrem Glykogen frei.",
      organs: ["liver", "brain", "heart"], vessels: ["lh", "brain"],
      streams: [{ p: "p-lh", n: 2, type: ["glu"], speed: .2 }, { p: "p-brain", n: 2, type: ["glu"], speed: .18 }] }
  ];
  const STAGE_MS = 7500;
  const NS = "http://www.w3.org/2000/svg";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const bodySvg = document.getElementById("body");
  const particlesG = document.getElementById("particles");
  const detail = document.getElementById("detail");
  const stepsEl = document.getElementById("steps");
  const playBtn = document.getElementById("play"), prevBtn = document.getElementById("prev"), nextBtn = document.getElementById("next");

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  /* ---------- Blutzuckerkurve ---------- */
  const DATA = [[0, 90], [10, 93], [20, 108], [30, 128], [45, 140], [60, 130], [90, 106], [120, 90], [150, 84], [180, 89]];
  const X0 = 40, X1 = 408, Y0 = 168, Y1 = 14, VMIN = 60, VMAX = 160, TMAX = 180;
  const cx = t => X0 + t / TMAX * (X1 - X0);
  const cy = v => Y0 - (v - VMIN) / (VMAX - VMIN) * (Y0 - Y1);
  function glucoseAt(t) {
    t = Math.max(0, Math.min(TMAX, t));
    // Kubische Hermite-Interpolation, damit die Kurve ohne Stufen durch die Stützpunkte läuft
    const slope = i => {
      const a = DATA[Math.max(0, i - 1)], b = DATA[Math.min(DATA.length - 1, i + 1)];
      return (b[1] - a[1]) / (b[0] - a[0]);
    };
    for (let i = 1; i < DATA.length; i++) {
      if (t <= DATA[i][0]) {
        const [t0, v0] = DATA[i - 1], [t1, v1] = DATA[i], h = t1 - t0, u = (t - t0) / h;
        const u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * v0 + (u3 - 2 * u2 + u) * h * slope(i - 1) + (-2 * u3 + 3 * u2) * v1 + (u3 - u2) * h * slope(i);
      }
    }
    return DATA[DATA.length - 1][1];
  }
  (function buildChart() {
    const g = document.getElementById("cgrid");
    for (const v of [80, 100, 120, 140]) {
      el("line", { class: "gridline", x1: X0, x2: X1, y1: cy(v), y2: cy(v) }, g);
      el("text", { x: X0 - 6, y: cy(v) + 4, "text-anchor": "end" }, g).textContent = v;
    }
    el("line", { class: "axis", x1: X0, x2: X1, y1: Y0, y2: Y0 }, g);
    for (let t = 0; t <= 180; t += 30) {
      el("text", { x: cx(t), y: Y0 + 16, "text-anchor": "middle" }, g).textContent = t;
    }
    el("text", { x: X1, y: Y0 + 30, "text-anchor": "end" }, g).textContent = "Minuten nach dem Essen";
    let d = "";
    for (let t = 0; t <= TMAX; t += 2) d += (t ? "L" : "M") + cx(t).toFixed(1) + "," + cy(glucoseAt(t)).toFixed(1);
    document.getElementById("ccurve").setAttribute("d", d);
    document.getElementById("cghost").setAttribute("d", d);
    document.getElementById("carea").setAttribute("d", d + `L${X1},${Y0}L${X0},${Y0}Z`);
    const tb = document.querySelector("#ctable tbody");
    for (let t = 0; t <= 180; t += 30) tb.insertAdjacentHTML("beforeend", `<tr><td>${t}</td><td>${Math.round(glucoseAt(t))}</td></tr>`);
  })();
  const chart = document.getElementById("chart"), cmarker = document.getElementById("cmarker"), ctip = document.getElementById("ctip"),
        ccross = document.getElementById("ccross"), ccliprect = document.getElementById("ccliprect");
  let chartT = 0, chartTarget = 0, hoverT = null;
  function drawChart() {
    ccliprect.setAttribute("width", cx(chartT));
    const t = hoverT ?? chartT, v = glucoseAt(t);
    cmarker.setAttribute("cx", cx(t)); cmarker.setAttribute("cy", cy(v));
    ccross.style.display = hoverT === null ? "none" : "";
    ccross.setAttribute("x1", cx(t)); ccross.setAttribute("x2", cx(t));
    ctip.textContent = `${Math.round(t)} min: ${Math.round(v)} mg/dl`;
    const right = cx(t) > 300;
    ctip.setAttribute("text-anchor", right ? "end" : "start");
    ctip.setAttribute("x", Math.max(X0, Math.min(X1, cx(t) + (right ? -8 : 8))));
  }
  chart.addEventListener("pointermove", e => {
    const r = chart.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 420;
    hoverT = Math.max(0, Math.min(TMAX, (x - X0) / (X1 - X0) * TMAX));
    drawChart();
  });
  chart.addEventListener("pointerleave", () => { hoverT = null; drawChart(); });

  /* ---------- Teilchen ---------- */
  const pathCache = {};
  function pathInfo(id) {
    if (!pathCache[id]) { const p = document.getElementById(id); pathCache[id] = { p, len: p.getTotalLength() }; }
    return pathCache[id];
  }
  function makeParticle(type) {
    const g = el("g", { class: "particle" }, particlesG);
    if (type === "glu") el("circle", { class: "p-glu", r: 5.5 }, g);
    else if (type === "fru") el("rect", { class: "p-fru", x: -5, y: -5, width: 10, height: 10, rx: 2 }, g);
    else if (type === "ins") el("path", { class: "p-ins", d: "M0,-6.5L6.5,0L0,6.5L-6.5,0Z" }, g);
    else if (type === "sig") el("circle", { class: "p-sig", r: 4 }, g);
    else { // suc / split: Glukose + Fruktose als Paar
      g.a = el("circle", { class: "p-glu", r: 5.5 }, g);
      g.b = el("rect", { class: "p-fru", x: -5, y: -5, width: 10, height: 10, rx: 2 }, g);
    }
    g.kind = type;
    return g;
  }
  let active = [];
  function buildParticles(stage) {
    particlesG.textContent = "";
    active = [];
    for (const s of stage.streams) {
      const info = pathInfo(s.p);
      for (let i = 0; i < s.n; i++) active.push({ s, info, phase: i / s.n, node: makeParticle(s.type[i % s.type.length]) });
    }
  }
  function drawParticles(sec) {
    for (const a of active) {
      const u = (sec * a.s.speed + a.phase) % 1;
      const pos = a.info.p.getPointAtLength(u * (a.s.to ?? 1) * a.info.len);
      a.node.setAttribute("transform", `translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)})`);
      a.node.setAttribute("opacity", Math.min(1, u * 10, (1 - u) * 10).toFixed(2));
      if (a.node.a) {
        // Saccharose bleibt verbunden; im Dünndarm trennt die Saccharase das Paar
        const d = a.node.kind === "split" ? 5 + 8 * Math.max(0, Math.min(1, (u - .25) / .3)) : 5;
        a.node.a.setAttribute("cx", -d); a.node.b.setAttribute("x", d - 5);
      }
    }
  }

  /* ---------- Ablaufsteuerung ---------- */
  STAGES.forEach((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button type="button" data-i="${i}"><span class="when"></span><span class="what"></span></button>`;
    li.querySelector(".when").textContent = s.when;
    li.querySelector(".what").textContent = s.title;
    stepsEl.appendChild(li);
  });

  let stage = 0, playing = !reduced, stageStart = performance.now();
  function showStage(i) {
    stage = i;
    const s = STAGES[i];
    bodySvg.dataset.stage = i;
    document.querySelectorAll(".organ").forEach(o => o.classList.toggle("on", s.organs.includes(o.dataset.o)));
    document.querySelectorAll("[data-v]").forEach(v => v.classList.toggle("on", s.vessels.includes(v.dataset.v)));
    stepsEl.querySelectorAll("button").forEach((b, k) => b.classList.toggle("on", k === i));
    detail.innerHTML = `<div class="eyebrow"></div><h2></h2><p></p>`;
    detail.querySelector(".eyebrow").textContent = `Schritt ${i + 1} von ${STAGES.length} · ${s.when}`;
    detail.querySelector("h2").textContent = s.title;
    detail.querySelector("p").textContent = s.text;
    chartTarget = s.min;
    buildParticles(s);
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === STAGES.length - 1;
    stageStart = performance.now();
    updatePlayLabel();
  }
  function updatePlayLabel() {
    const atEnd = stage === STAGES.length - 1;
    playBtn.textContent = playing ? "Pause" : (atEnd ? "Von vorn" : "Abspielen");
  }
  function setPlaying(v) { playing = v; stageStart = performance.now(); updatePlayLabel(); }

  playBtn.addEventListener("click", () => {
    if (!playing && stage === STAGES.length - 1) { chartT = 0; showStage(0); }
    setPlaying(!playing);
  });
  prevBtn.addEventListener("click", () => { setPlaying(false); showStage(Math.max(0, stage - 1)); });
  nextBtn.addEventListener("click", () => { setPlaying(false); showStage(Math.min(STAGES.length - 1, stage + 1)); });
  stepsEl.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) { setPlaying(false); showStage(+b.dataset.i); }
  });

  function frame(now) {
    if (playing && now - stageStart > STAGE_MS) {
      if (stage < STAGES.length - 1) showStage(stage + 1);
      else setPlaying(false);
    }
    // Kurve gleitet zum Zeitpunkt des aktuellen Schritts
    const diff = chartTarget - chartT;
    chartT = Math.abs(diff) < .2 || reduced ? chartTarget : chartT + diff * .05;
    drawChart();
    drawParticles(reduced ? 0.35 : now / 1000);
    requestAnimationFrame(frame);
  }
  showStage(0);
  requestAnimationFrame(frame);
</script>
</body>
</html>
